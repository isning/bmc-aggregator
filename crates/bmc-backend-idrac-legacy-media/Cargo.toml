[package]
name = "bmc-backend-idrac-legacy-media"
version = "0.1.0"
edition = "2021"

[dependencies]
bmc-idrac-model = { path = "../bmc-idrac-model" }
async-trait = "0.1"
bmc-backend-support = { path = "../bmc-backend-support" }
bmc-feature-api = { path = "../bmc-feature-api" }
native-tls = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
