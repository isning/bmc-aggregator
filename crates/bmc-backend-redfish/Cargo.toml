[package]
name = "bmc-backend-redfish"
version = "0.1.0"
edition = "2021"

[dependencies]
bmc-backend-support = { path = "../bmc-backend-support" }
bmc-backend-model = { path = "../bmc-backend-model" }
async-trait = "0.1"
bmc-feature-api = { path = "../bmc-feature-api" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full", "test-util"] }
